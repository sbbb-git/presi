name: Deploiement GitHub Pages

on:
  push:
    branches:
      - main
      - claude/election-poll-scraper-33nqxx
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois ; on n'annule pas un deploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Uploader le site (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deployer
        id: deployment
        uses: actions/deploy-pages@v4
